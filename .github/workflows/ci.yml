name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both runners are AArch64, so the hand-written backend's output is executed natively.
        os: [ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 23 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          echo "LLVM_CONFIG=llvm-config-23" >> "$GITHUB_ENV"

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LLVM_CONFIG=$(brew --prefix llvm)/bin/llvm-config" >> "$GITHUB_ENV"

      - name: Build
        run: make -j4 LLVM_CONFIG="$LLVM_CONFIG"

      - name: Test (3 backends x every program, diagnostics, grammar)
        run: make test LLVM_CONFIG="$LLVM_CONFIG"
