<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mccomp · Mini-C compiler explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230091bd%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">mccomp</span>
      <span class="tagline">Mini-C → LLVM IR → AArch64 · compiler explorer</span>
    </div>
    <div class="controls">
      <label class="select-label">Example
        <select id="examples"></select>
      </label>
      <div class="seg" id="target" title="Which AArch64 ABI flavour to generate">
        <button data-target="darwin">Apple arm64</button>
        <button data-target="linux">Linux AArch64</button>
      </div>
      <button id="run" class="primary" title="Build with all three backends and run (⌘/Ctrl + Enter)">▶ Run</button>
    </div>
  </header>

  <nav id="pipeline" aria-label="Compiler pipeline"></nav>

  <main>
    <section id="left">
      <div class="pane-title">Source <span class="hint">edits recompile live · hover output to trace it back here</span></div>
      <div class="editor" id="editor">
        <div class="gutter" id="gutter"></div>
        <div class="code-wrap" id="code-wrap">
          <div class="marks" id="marks"></div>
          <pre id="highlight" aria-hidden="true"></pre>
          <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        </div>
      </div>
      <div id="diagnostics"></div>
    </section>

    <section id="right">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div id="panel"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
